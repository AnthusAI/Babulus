name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: BDD
        run: npm run bdd

  leftblock:
    name: LeftBlock
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LeftBlock
        run: |
          python -m pip install leftblock==0.10.0
          leftblock install --local --check-only
      - name: Check the whole pull request, board events included
        run: |
          git reset --soft "origin/${{ github.base_ref }}"
          leftblock check

  deploy:
    name: Deploy
    needs: node
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: ${{ vars.AMPLIFY_APP_ID }}
      role-to-assume: ${{ vars.AMPLIFY_DEPLOY_ROLE_ARN }}
