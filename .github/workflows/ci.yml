name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  node:
    name: Node checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: BDD
        run: npm run bdd

  speech:
    name: Speech and control plane checks
    runs-on: ubuntu-24.04
    env:
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install speech package
        working-directory: packages/speech
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Install control plane libraries
        working-directory: packages/control-plane
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Black
        working-directory: packages/speech
        run: python -m black --check src tests features ../control-plane ../worker-image/src
      - name: Ruff
        working-directory: packages/speech
        run: python -m ruff check src tests features ../control-plane ../worker-image/src
      - name: Embed - install, lint, test and build
        working-directory: packages/embed
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
      - name: Speech unit tests
        working-directory: packages/speech
        run: python -m pytest -q
      - name: Speech and control plane specs
        working-directory: packages/speech
        run: python -m behave features
      - name: Control plane unit tests
        working-directory: packages/control-plane
        run: python -m pytest -q
      - name: Construct - install, build and test
        working-directory: packages/construct
        run: |
          npm ci
          npm test

  console:
    name: Console checks
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        working-directory: apps/console
        run: npm ci
      - name: Lint
        working-directory: apps/console
        run: npm run lint
      - name: Type check
        working-directory: apps/console
        run: npm test
      - name: Build
        working-directory: apps/console
        env:
          NEXT_DIST_DIR: .next-ci
        run: npm run build
      - name: Playwright with mocked API responses
        working-directory: apps/console
        env:
          CI: "true"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

  leftblock:
    name: LeftBlock
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LeftBlock
        run: |
          python -m pip install leftblock==0.10.0
          leftblock install --local --check-only
      - name: Check the whole pull request, board events included
        run: |
          git reset --soft "origin/${{ github.base_ref }}"
          leftblock check

  deploy:
    name: Deploy
    needs: node
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      id-token: write
      contents: read
    uses: AnthusAI/Papyrus/.github/workflows/amplify-deploy.yml@main
    with:
      app-id: ${{ vars.AMPLIFY_APP_ID }}
      role-to-assume: ${{ vars.AMPLIFY_DEPLOY_ROLE_ARN }}
